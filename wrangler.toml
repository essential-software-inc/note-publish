name = "note-publish"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "ACCOUNTS"
id = "c1191cb259ad4fbbb10750965994008a"

[[kv_namespaces]]
binding = "REPORTS"
id = "eff8ddd6244448e9999d6bd3baef9a9e"

[[kv_namespaces]]
binding = "SLUGS"
id = "9d838f50fca64e769f5924c7c044f017"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "note-publish-html"

# Ads only: round-robin cursor + view-credit ledger need atomic
# read-then-write under concurrency, which KV (last-write-wins, no
# transactions) can't guarantee. Everything else (page HTML, slugs, owner
# tokens, accounts) stays in KV/R2 exactly as it already was.
# Create with: wrangler d1 create note-publish-ads
# Apply schema: wrangler d1 execute note-publish-ads --remote --file=migrations/0001_ads.sql
[[d1_databases]]
binding = "ADS_DB"
database_name = "note-publish-ads"
database_id = "1926459f-558e-4bd5-9a9f-bef271775dc8"

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = false
head_sampling_rate = 1
